<div class="mb-3 d-flex justify-content-between align-items-center">
  <h4 class="m-0">Заметки</h4>
  <div>
    <button class="btn btn-secondary btn-sm" (click)="refresh()" [disabled]="loading">
      Обновить
    </button>
  </div>
</div>

<div *ngIf="loading" class="text-center my-3">
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Загрузка...</span>
  </div>
</div>

<div *ngIf="error" class="alert alert-danger">
  {{ error }}
</div>

<div *ngIf="!loading && notes.length === 0" class="alert alert-info">
  Список заметок пуст. Добавьте первую заметку.
</div>

<div class="row">
  <div class="col-md-6 mb-3" *ngFor="let note of notes">
    <div class="card h-100">
      <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h5 class="card-title mb-0">{{ note.title }}</h5>
          <small class="text-muted">{{ note.createdAt ? (note.createdAt | date:'short') : '' }}</small>
        </div>
        <p class="card-text flex-grow-1" *ngIf="note.text; else noText">{{ note.text }}</p>
        <ng-template #noText><p class="text-muted">Нет текста</p></ng-template>

        <div class="mt-3 d-flex justify-content-end">
          <button
            class="btn btn-danger btn-sm"
            (click)="deleteNote(note.id)"
            [disabled]="deletingId === note.id"
          >
            {{ deletingId === note.id ? 'Удаление...' : 'Удалить' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
