<form [formGroup]="noteForm" (ngSubmit)="onSubmit()" class="note-form">
  <div class="form-group">
    <label for="title">Title</label>
    <input
      id="title"
      type="text"
      class="form-control"
      formControlName="title"
      [class.is-invalid]="f.title.invalid && (f.title.dirty || f.title.touched)"
      placeholder="Enter title"
      maxlength="100"
    />
    <div class="invalid-feedback" *ngIf="f.title.invalid && (f.title.dirty || f.title.touched)">
      <div *ngIf="f.title.errors?.required">Title is required.</div>
      <div *ngIf="f.title.errors?.maxlength">Title cannot exceed 100 characters.</div>
    </div>
    <small class="form-text text-muted" *ngIf="f.title.value?.length">
      {{ f.title.value.length }} / 100 characters
    </small>
  </div>

  <div class="form-group">
    <label for="content">Content</label>
    <textarea
      id="content"
      rows="6"
      class="form-control"
      formControlName="content"
      [class.is-invalid]="f.content.invalid && (f.content.dirty || f.content.touched)"
      placeholder="Write your note..."
    ></textarea>
    <div class="invalid-feedback" *ngIf="f.content.invalid && (f.content.dirty || f.content.touched)">
      <div *ngIf="f.content.errors?.required">Content is required.</div>
    </div>
  </div>

  <div class="form-group d-flex justify-content-between align-items-center">
    <div *ngIf="error" class="alert alert-danger mb-0" role="alert">
      {{ error }}
    </div>

    <div class="button-group">
      <button type="button" class="btn btn-secondary mr-2" (click)="onCancel()" [disabled]="submitting">
        Cancel
      </button>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="noteForm.invalid || submitting"
      >
        <span *ngIf="submitting" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        {{ isEditMode ? 'Update Note' : 'Create Note' }}
      </button>
    </div>
  </div>
</form>
